[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "policydesk"
version = "0.1.0.dev1"
description = "Offline synthetic policy workflow prototype"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "typer>=0.20,<1", "PyYAML>=6,<7", "lingua-language-detector>=2.1,<3"]

[project.scripts]
policydesk = "policydesk.cli:app"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "pyright>=1.1.400,<2", "types-PyYAML>=6", "pillow>=12,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/policydesk"]

[tool.ruff.lint.per-file-ignores]
"scripts/author_cases.py" = ["B023"]
